<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
      <main class="Parent">
        <main class="mainParent">
           <h2 class="loginHeading">Login</h2>
        <section class="login">
       <form action="index.html">

    <label for="email">Username</label>
    <div class="login mail"> 
        <input type="text" id="email" placeholder="  Enter your Username" required name="Username">
    </div><br><br>

    <label for="password">Password</label>
    <div class="login pw">
        <input type="password" id="password" placeholder="  Enter your password" required name="password">
    </div><br>

    <button type="submit" >LOGIN</button>

    <div class="signup">
        <h3 >Don't have an Account?</h3>

        <a href="signup.html" target="_blank"><h3>Sign up</h3></a><br>

        <!-- <a href="fp.html">Forgot password?</a> -->
    </div>

</form>
    
</body>
</html>
